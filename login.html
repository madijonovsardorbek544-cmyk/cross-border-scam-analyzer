<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CBSA — Login</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="nav">
    <div class="container nav-inner">
      <div class="brand"><span>CBSA</span><span class="badge">Account</span></div>
      <div class="links">
        <a href="./index.html">Home</a>
        <a href="./cases.html">Cases</a>
        <a href="./privacy.html">Privacy</a>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="container grid">
      <div class="card">
        <div class="card-inner">
          <h2>Create account</h2>
          <p class="note">Email-only. We do not collect phone numbers. Age is stored as a group, not exact age.</p>
          <hr>

          <label class="tag">Email</label>
          <input id="suEmail" type="email" placeholder="you@example.com" style="width:100%;padding:10px;border-radius:14px;border:1px solid rgba(255,255,255,.10);background:rgba(0,0,0,.25);color:#eaf0ff;margin:8px 0 12px;" />

          <label class="tag">Password</label>
          <input id="suPass" type="password" placeholder="••••••••" style="width:100%;padding:10px;border-radius:14px;border:1px solid rgba(255,255,255,.10);background:rgba(0,0,0,.25);color:#eaf0ff;margin:8px 0 12px;" />

          <button id="signupBtn">Sign up</button>
          <p id="suMsg" class="note"></p>
        </div>
      </div>

      <div class="card">
        <div class="card-inner">
          <h2>Log in</h2>
          <p class="note">If you already have an account, log in here.</p>
          <hr>

          <label class="tag">Email</label>
          <input id="liEmail" type="email" placeholder="you@example.com" style="width:100%;padding:10px;border-radius:14px;border:1px solid rgba(255,255,255,.10);background:rgba(0,0,0,.25);color:#eaf0ff;margin:8px 0 12px;" />

          <label class="tag">Password</label>
          <input id="liPass" type="password" placeholder="••••••••" style="width:100%;padding:10px;border-radius:14px;border:1px solid rgba(255,255,255,.10);background:rgba(0,0,0,.25);color:#eaf0ff;margin:8px 0 12px;" />

          <button class="ghost" id="loginBtn">Log in</button>
          <p id="liMsg" class="note"></p>
        </div>
      </div>
    </div>

    <div class="footer">© 2026 Cross-Border Scam Analyzer | Student Project</div>
  </div>

  <script type="module">
    import { auth } from "./firebase.js";
    import { createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

    const suMsg = document.querySelector("#suMsg");
    const liMsg = document.querySelector("#liMsg");

    document.querySelector("#signupBtn").addEventListener("click", async () => {
      suMsg.textContent = "";
      try{
        const email = document.querySelector("#suEmail").value.trim();
        const pass = document.querySelector("#suPass").value.trim();
        await createUserWithEmailAndPassword(auth, email, pass);
        suMsg.textContent = "Account created. Redirecting…";
        location.href = "./dashboard.html";
      }catch(e){
        suMsg.textContent = e.message;
      }
    });

    document.querySelector("#loginBtn").addEventListener("click", async () => {
      liMsg.textContent = "";
      try{
        const email = document.querySelector("#liEmail").value.trim();
        const pass = document.querySelector("#liPass").value.trim();
        await signInWithEmailAndPassword(auth, email, pass);
        liMsg.textContent = "Logged in. Redirecting…";
        location.href = "./dashboard.html";
      }catch(e){
        liMsg.textContent = e.message;
      }
    });
  </script>
</body>
</html>
